 <div class="paper"><h2>${c=='rec'?'Приходная накладная':'Расходная накладная (фактура)'} ${num(c,r)} от ${fd(r.date)}</h2><p><b>${esc(g.name)}</b><br>${esc(g.addr)} ${esc(g.phone)}<br>${g.stir?'ИНН/СТИР: '+esc(g.stir):''}</p><p>${c=='rec'?'Поставщик':esc(g.cl)}: <b>${esc(PT(r.party).name)}</b>${r.drv?'<br>Водитель: '+esc(r.drv):''}${r.note?'<br>Комментарий: '+esc(r.note):''}${r.void?'<br><b>ДОКУМЕНТ ОТМЕНЁН</b>':''}</p>
 <table><tr><th>№</th><th>Товар</th><th>Ед.</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr>${r.items.map(i=>`<tr><td>${++n}</td><td>${esc((PR(i.p)||{}).name)}</td><td>${esc((PR(i.p)||{}).unit)}</td><td>${nf(i.q)}</td><td>${nf(i.price)}</td><td>${nf(i.q*i.price)}</td></tr>`).join('')}<tr class="t"><td colspan="5">Итого</td><td>${nf(S)}</td></tr>${rt2?`<tr><td colspan="5">НДС ${rt2}%</td><td>${nf(S*rt2/100)}</td></tr><tr class="t"><td colspan="5">Всего с НДС</td><td>${nf(S*(1+rt2/100))}</td></tr>`:''}</table><div class="sig"><span>Отпустил ________</span><span>Получил ________</span></div></div>`},
pay(){const L=[...A('pay')].reverse();$('#v').innerHTML=`<h2>Деньги</h2><div class="card"><div class="bar"><label>Тип<select id="yd"><option value="in">Получили деньги</option><option value="out">Выдали деньги</option></select></label><label>Контрагент<select id="yp">${D.party.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>Дата<input type="date" id="yt" value="${today()}"></label><label>Сумма<input type="number" step="any" id="ya"></label><label>Комментарий<input id="yc"></label><button class="pr" onclick="savePay()">Сохранить</button></div></div><h3>Журнал</h3>`+(L.length?tbl(['Дата','Тип','Кто','Сумма','Комментарий',''],L.map(p=>[fd(p.date),p.dir=='in'?'<span class="ok">Получили</span>':'Выдали',esc(PT(p.party).name),nf(p.amount),esc(p.note||''),me.role=='admin'?`<button class="dn" onclick="voidDoc('pay',${p.id})">Отменить</button>`:''])):empty('Операций нет.'))},
rep(){RP=repData(rt.t,rt.a,rt.b);const T={stock:'Остатки',sales:'Продажи по дням',profit:'Прибыль по товарам',debts:'Долги',moves:'Движение товара',jour:'Журнал документов'};
 $('#v').innerHTML=`<h2>Отчёты</h2><div class="bar np"><label>Отчёт<select onchange="rt.t=this.value;V.rep()">${Object.keys(T).map(k=>`<option value="${k}" ${k==rt.t?'selected':''}>${T[k]}</option>`).join('')}</select></label><label>С<input type="date" value="${rt.a}" onchange="rt.a=this.value;V.rep()"></label><label>По<input type="date" value="${rt.b}" onchange="rt.b=this.value;V.rep()"></label><button class="gr" onclick="xl('${T[rt.t]}',[RP.h,...RP.r.map(x=>x.map(c=>typeof c=='string'?c.replace(/<[^>]+>/g,''):c)),RP.t||[]])">Скачать Excel</button><button onclick="print()">Печать</button></div>`+(RP.r.length?tbl(RP.h,RP.r.map(x=>x.map((c,i)=>typeof c=='number'&&i?nf(c):c)),RP.t&&RP.t.map((c,i)=>typeof c=='number'?nf(c):c)):empty('Нет данных за период.'))},
set(){const g=CF();const F=[['name','Название организации'],['addr','Адрес'],['phone','Телефон'],['stir','ИНН/СТИР'],['rate','НДС, %'],['cur','Валюта'],['cl','Как называть клиентов (Покупатель, Детсад, Клиент)']];
 $('#v').innerHTML=`<h2>Настройки</h2><div class="card"><h3 style="margin-top:0">Организация</h3><div class="bar">${F.map(f=>`<label>${f[1]}<input value="${esc(g[f[0]])}" onchange="setCf('${f[0]}',this.value)"></label>`).join('')}</div></div>
 <div class="card"><h3 style="margin-top:0">Сотрудники</h3>${sb?'<p class="mu">Сотрудники создаются в Supabase (Authentication → Users), роль задаётся в таблице profiles: admin, keeper, cashier, acc.</p>':`<div class="bar"><label>Имя<input id="un"></label><label>Пароль<input id="up" type="password"></label><label>Роль<select id="ur">${Object.keys(RN).map(k=>`<option value="${k}">${RN[k]}</option>`).join('')}</select></label><button class="pr" onclick="addUser()">Добавить</button></div>`+D.usr.map(u=>`<span class="chip">${esc(u.name)} · ${RN[u.role]}</span> `).join('')}</div>
 <div class="card"><h3 style="margin-top:0">Данные</h3><div class="bar"><button onclick="bk()">Скачать копию (JSON)</button>${sb?'':'<button class="dn" onclick="if(confirm(\'Стереть ВСЕ данные?\')){localStorage.removeItem(LS);location.reload()}">Очистить всё</button>'}</div></div>`},
pos(){$('#v').innerHTML=`<div class="pos"><div><div class="bar"><label style="flex:1">Поиск или штрихкод<input id="ps" style="width:100%" value="${esc(pq)}" oninput="pq=this.value;pG()" onkeydown="if(event.key=='Enter')posBar(this.value)" autofocus></label><button onclick="camScan()">Камера</button></div><div class="pg" id="pg"></div></div><div class="cart" id="cr"></div></div>`;pG();pC()}};
/* ===== ДЕЙСТВИЯ ===== */
function pT(){const q=pq.toLowerCase(),L=D.prod.filter(p=>p.name.toLowerCase().includes(q)),ad=me.role=='admin'||me.role=='keeper',I=(i,f,t)=>ad?`<input ${t?'type="number" step="any"':''} value="${esc(p0(i,f))}" onchange="D.prod[${i}].${f}=${t?'+':''}this.value;put('prod',D.prod[${i}])">`:esc(p0(i,f));
 $('#pt').innerHTML=L.length?tbl(['Товар','Ед.','Цена','Закупка','Штрихкод','Мин.','Остаток',''],L.map(p=>{const i=D.prod.indexOf(p);return[esc(p.name),I(i,'unit'),I(i,'price',1),I(i,'cost',1),I(i,'bar'),I(i,'min',1),`<b class="${st(p.id)<=(p.min||0)&&p.min?'bad':''}">${nf(st(p.id))}</b>`,me.role=='admin'?`<button class="dn" onclick="if(confirm('Удалить товар?'))rm('prod',${p.id}).then(()=>pT())">×</button>`:'']})):empty('Товаров нет. Добавьте выше.')}
const p0=(i,f)=>D.prod[i][f]??'';
function addProd(){const n=$('#pn').value.trim();if(!n||PN(n))return alert('Введите уникальное название');put('prod',{id:Date.now(),name:n,unit:$('#pu').value||'шт',price:+$('#pp').value||0,cost:+$('#pcs').value||0,bar:$('#pb').value.trim(),min:+$('#pmn').value||0}).then(()=>V.prod())}
async function bulk(){let n=0;for(const l of $('#bk').value.split('\n')){const[a,u,p,c,b]=l.split(/[;\t]/).map(s=>s.trim());if(a&&!PN(a)){await put('prod',{id:Date.now()+n++,name:a,unit:u||'шт',price:+p||0,cost:+c||0,bar:b||'',min:0})}}V.prod()}
function addParty(){const n=$('#qn').value.trim();if(!n)return;put('party',{id:Date.now(),name:n,type:$('#qt').value,phone:$('#qp').value}).then(()=>V.party())}
function rw(){const rc=cur=='rec';$('#rw').innerHTML='<div class="bar"><label>Штрихкод<input id="bc" inputmode="numeric" onkeydown="if(event.key==\'Enter\'){addBar(this.value);this.value=\'\'}"></label></div>'+tbl(['Товар','Кол-во',rc?'Закупка':'Цена',''],rows.map((r,i)=>{const p=PN(r.n);return[`<input list="pl" value="${esc(r.n||'')}" onchange="pick(${i},this.value)">${p&&!rc?`<small>на складе ${nf(st(p.id))} ${esc(p.unit)}</small>`:''}`,`<input type="number" step="any" value="${r.q??''}" oninput="rows[${i}].q=this.value">`,`<input type="number" step="any" value="${r.pr??''}" oninput="rows[${i}].pr=this.value">`,`<button onclick="rows.splice(${i},1);if(!rows.length)rows.push({});rw()">×</button>`]}))}
function pick(i,v){const p=PN(v);rows[i].n=v;if(p)rows[i].pr=cur=='rec'?p.cost:p.price;rw()}
function addBar(c){const p=D.prod.find(x=>x.bar&&x.bar==c.trim());if(!p)return toast('Штрихкод не найден');const r=rows.find(x=>x.n==p.name);if(r)r.q=(+r.q||0)+1;else{const e=rows.findIndex(x=>!x.n);const o={n:p.name,q:1,pr:cur=='rec'?p.cost:p.price};e>=0?rows[e]=o:rows.push(o)}rw()}
async function saveDoc(){const rc=cur=='rec',it=rows.filter(r=>PN(r.n)&&+r.q>0).map(r=>({p:PN(r.n).id,q:+r.q,price:+r.pr||0,cost:PN(r.n).cost||0}));if(!it.length)return alert('Выберите товары из списка и укажите количество');
 if(rows.some(r=>(r.n||r.q)&&!(PN(r.n)&&+r.q>0))&&!confirm('Часть строк неполная и не сохранится. Продолжить?'))return;
 if(!rc){const o=it.filter(x=>x.q>st(x.p));if(o.length&&!confirm('Больше, чем на складе: '+o.map(x=>PR(x.p).name).join(', ')+'. Сохранить?'))return}
 const r={id:Date.now(),num:nx(cur),date:$('#d').value,time:hhmm(),party:+$('#pa').value||null,items:it,by:me.name};if(!rc){r.drv=$('#dr').value;r.note=$('#nt').value}
 if(rc)for(const x of it){const p=PR(x.p);if(x.price&&p.cost!=x.price){p.cost=x.price;await put('prod',p)}}
 await put(cur,r);if(!rc&&$('#pd').checked&&r.party)await put('pay',{id:Date.now()+1,date:r.date,dir:'in',party:r.party,amount:tot(r),note:'Оплата '+num('iss',r),by:me.name});doc={c:cur,id:r.id};render()}
async function voidDoc(c,id){if(!confirm('Отменить документ? Он останется в журнале, но не будет учитываться.'))return;const o=D[c].find(x=>x.id==id);o.void=true;o.voidBy=me.name;await put(c,o);render()}
function savePay(){const a=+$('#ya').value,p=+$('#yp').value;if(!p||!(a>0))return alert('Выберите контрагента и укажите сумму');put('pay',{id:Date.now(),date:$('#yt').value,dir:$('#yd').value,party:p,amount:a,note:$('#yc').value,by:me.name}).then(()=>V.pay())}
function setCf(k,v){const g={...CF(),[k]:k=='rate'?+v:v};put('cfg',g)}
async function addUser(){const n=$('#un').value.trim(),p=$('#up').value;if(!n||!p)return alert('Введите имя и пароль');if(D.usr.some(u=>u.name.toLowerCase()==n.toLowerCase()))return alert('Такое имя уже есть');await put('usr',{id:Date.now(),name:n,hash:await hash(p),role:$('#ur').value});V.set()}
function bk(){const b=new Blob([JSON.stringify({...D,usr:[]})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ae7_copy_'+today()+'.json';a.click()}
/* ===== КАССА ===== */
function pG(){const q=pq.toLowerCase(),L=D.prod.filter(p=>p.name.toLowerCase().includes(q)).slice(0,60);$('#pg').innerHTML=L.length?L.map(p=>`<button class="pc" onclick="addC(${p.id})"><b>${esc(p.name)}</b><small class="mu">${nf(st(p.id))} ${esc(p.unit)}</small><span>${nf(p.price||0)}</span></button>`).join(''):'<p class="mu">Ничего не найдено. Товары добавляет админ в разделе «Товары».</p>'}
function addC(id){const c=cart.find(x=>x.p==id);c?c.q++:cart.push({p:id,q:1});pC()}
function posBar(v){const p=D.prod.find(x=>x.bar&&x.bar==v.trim());if(p){addC(p.id);pq='';$('#ps').value='';pG()}}
function pC(){const T=sum(cart,i=>i.q*(PR(i.p).price||0)),pd=+($('#pg2')||{}).value||0;$('#cr').innerHTML=`<b>Чек</b>`+(cart.length?cart.map((i,k)=>`<div class="ci"><div><b>${esc(PR(i.p).name)}</b><small>${nf(PR(i.p).price)} × ${nf(i.q)}</small></div><button onclick="cq(${k},-1)">−</button><b>${nf(i.q)}</b><button onclick="cq(${k},1)">+</button></div>`).join(''):'<p class="mu">Нажмите на товар, чтобы добавить.</p>')+`<div class="tot">${nf(T)} ${CF().cur}</div><div class="bar"><button class="${pm=='cash'?'pr':''}" onclick="pm='cash';pC()">Наличные</button><button class="${pm=='card'?'pr':''}" onclick="pm='card';pC()">Карта</button></div>${pm=='cash'?`<label>Получено<input id="pg2" type="number" step="any" value="${pd||''}" oninput="chg(${T})"></label><p id="chg" class="ok"></p>`:''}<div class="bar"><button class="gr" style="flex:1;padding:14px;font-size:16px" onclick="sell()">Оплатить</button><button class="dn" onclick="cart=[];pC()">Очистить</button></div>`;chg(T)}
function chg(T){const e=$('#chg'),v=+($('#pg2')||{}).value;if(e)e.textContent=v>=T&&T?'Сдача: '+nf(v-T):''}
function cq(k,d){cart[k].q+=d;if(cart[k].q<=0)cart.splice(k,1);pC()}
async function sell(){if(!cart.length)return;const it=cart.map(i=>({p:i.p,q:i.q,price:PR(i.p).price||0,cost:PR(i.p).cost||0})),o=it.filter(x=>x.q>st(x.p));if(o.length&&!confirm('Больше, чем на складе: '+o.map(x=>PR(x.p).name).join(', ')+'. Продать?'))return;
 const s={id:Date.now(),num:nx('sale'),date:today(),time:hhmm(),pay:pm,items:it,by:me.name};await put('sale',s);cart=[];doc={c:'sale',id:s.id};cur='pos';rcpt(s)}
function rcpt(s){let n=0;$('#v').innerHTML=`<div class="bar np"><button class="pr" onclick="doc=null;go('pos')">Новая продажа</button><button onclick="print()">Печать чека</button></div><div class="paper" style="max-width:360px"><h3 style="margin:0">${esc(CF().name)}</h3><p>Чек ${num('sale',s)}<br>${fd(s.date)} ${s.time}<br>Кассир: ${esc(s.by)}</p><table>${s.items.map(i=>`<tr><td>${esc(PR(i.p).name)}<br>${nf(i.q)} × ${nf(i.price)}</td><td>${nf(i.q*i.price)}</td></tr>`).join('')}<tr class="t"><td>Итого</td><td>${nf(tot(s))}</td></tr></table><p>Оплата: ${s.pay=='card'?'карта':'наличные'}</p></div>`}
function camScan(){if(!('BarcodeDetector' in window))return alert('Камера-сканер не поддерживается в этом браузере. Введите код или используйте сканер.');const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column';o.innerHTML='<video playsinline muted style="flex:1;object-fit:cover"></video><button style="margin:12px">Закрыть</button>';document.body.appendChild(o);
 const v=o.querySelector('video'),d=new BarcodeDetector();let s,on=1;const stop=()=>{on=0;s&&s.getTracks().forEach(t=>t.stop());o.remove()};o.querySelector('button').onclick=stop;
 navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(m=>{s=m;v.srcObject=m;v.play();(async()=>{while(on){try{const r=await d.detect(v);if(r.length){const c=r[0].rawValue;stop();posBar(c);return}}catch(e){}await new Promise(z=>setTimeout(z,250))}})()}).catch(()=>{stop();alert('Нет доступа к камере')})}
/* ===== ОТЧЁТЫ ===== */
function repData(t,a,b){const ip=r=>r.date>=a&&r.date<=b,S=[...A('sale'),...A('iss')].filter(ip);
 if(t=='stock')return{h:['Товар','Ед.','Остаток','Себестоимость','Сумма себест.','Цена','Сумма продажи'],r:D.prod.map(p=>{const s=st(p.id);return[p.name,p.unit,s,p.cost||0,s*(p.cost||0),p.price||0,s*(p.price||0)]}),t:['Итого','','','',sum(D.prod,p=>st(p.id)*(p.cost||0)),'',sum(D.prod,p=>st(p.id)*(p.price||0))]};
 if(t=='sales'){const g={};S.forEach(r=>{const x=g[r.date]=g[r.date]||[0,0,0];x[0]++;x[1]+=tot(r);x[2]+=cst(r)});const r=Object.keys(g).sort().map(d=>[fd(d),g[d][0],g[d][1],g[d][2],g[d][1]-g[d][2]]);return{h:['Дата','Документов','Выручка','Себестоимость','Прибыль'],r,t:['Итого',sum(r,x=>x[1]),sum(r,x=>x[2]),sum(r,x=>x[3]),sum(r,x=>x[4])]}}
 if(t=='profit'){const r=D.prod.map(p=>{let q=0,v=0,c=0;S.forEach(d=>d.items.filter(i=>i.p==p.id).forEach(i=>{q+=i.q;v+=i.q*i.price;c+=i.q*(i.cost||0)}));return[p.name,q,v,c,v-c,v?Math.round((v-c)/v*100)+'%':'']}).filter(x=>x[1]);return{h:['Товар','Продано','Выручка','Себестоимость','Прибыль','Маржа'],r,t:['Итого',sum(r,x=>x[1]),sum(r,x=>x[2]),sum(r,x=>x[3]),sum(r,x=>x[4]),'']}}
 if(t=='debts'){const r=D.party.map(p=>[p.name,p.type=='supplier'?'Поставщик':CF().cl,debt(p)]).filter(x=>x[2]);return{h:['Контрагент','Тип','Долг'],r,t:['Итого','',sum(r,x=>x[2])]}}
 if(t=='moves'){const f=(c,id,fn)=>qs(A(c).filter(fn),id),r=D.prod.map(p=>{const o=f('rec',p.id,x=>x.date<a)-f('iss',p.id,x=>x.date<a)-f('sale',p.id,x=>x.date<a),pi=f('rec',p.id,ip),ex=f('iss',p.id,ip)+f('sale',p.id,ip);return[p.name,o,pi,ex,o+pi-ex]}).filter(x=>x[1]||x[2]||x[3]);return{h:['Товар','Начало','Приход','Расход','Конец'],r}}
 const r=[...A('rec').map(x=>['Приход',x]),...A('iss').map(x=>['Расход',x]),...A('sale').map(x=>['Продажа',x])].filter(x=>ip(x[1])).map(x=>[fd(x[1].date)+' '+(x[1].time||''),x[0],num({'Приход':'rec','Расход':'iss','Продажа':'sale'}[x[0]],x[1]),PT(x[1].party).name,tot(x[1]),x[1].by||'']);return{h:['Дата','Вид','№','Контрагент','Сумма','Кто внёс'],r}}
boot();
